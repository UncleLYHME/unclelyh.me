server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # --- hardening -------------------------------------------------------
    # Only the methods the site actually uses
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # Small static site: cap request bodies and buffer pressure
    client_max_body_size 16k;
    client_body_buffer_size 16k;
    client_header_timeout 12s;
    client_body_timeout   12s;
    keepalive_timeout     30s;
    send_timeout          20s;

    # Never list directories
    autoindex off;

    # --- security headers ------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Origin-Agent-Cluster "?1" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data: https://ai.unclelyh.me; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://ai.unclelyh.me; connect-src 'self'; font-src 'self' https://ai.unclelyh.me; manifest-src 'self'; upgrade-insecure-requests" always;

    # Pretty URLs: serve page.html at /page, redirect the .html form
    location = /spelling {
        try_files /spelling.html =404;
    }
    location = /spelling.html {
        return 301 https://unclelyh.me/spelling;
    }

    # Cross-origin assets for ai.unclelyh.me (shared tokens.css, fonts, avatar)
    location ^~ /assets/ {
        add_header Access-Control-Allow-Origin "https://ai.unclelyh.me" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # Block dotfiles and repo/dev artifacts entirely
    location ~ /\.(?!well-known) {
        return 404;
    }
    location ~* (^|/)(Dockerfile|compose\.ya?ml|\.dockerignore|CHANGELOG\.md|README\.md|LICENSE|AGENTS\.md|CLAUDE\.md)$ {
        return 404;
    }
    location ^~ /nginx/ {
        return 404;
    }

    location = / {
        try_files /index.html =404;
    }

    location = /index.html {
        try_files /index.html =404;
    }

    location = /index.md {
        types { text/markdown md; }
        default_type text/markdown;
        try_files /index.md =404;
    }

    location = /llms.txt {
        default_type text/plain;
        try_files /llms.txt =404;
    }

    location = /.well-known/llms.txt {
        default_type text/plain;
        add_header Access-Control-Allow-Origin "*" always;
        try_files /.well-known/llms.txt =404;
    }

    location = /.well-known/api-catalog {
        default_type application/linkset+json;
        add_header Access-Control-Allow-Origin "*" always;
        try_files /.well-known/api-catalog =404;
    }

    location ^~ /.well-known/agent-skills/ {
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
