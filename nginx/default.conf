server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'; font-src 'self'; manifest-src 'self'; upgrade-insecure-requests" always;

    location = / {
        try_files /index.html =404;
    }

    location = /index.html {
        try_files /index.html =404;
    }

    location = /index.md {
        types { text/markdown md; }
        default_type text/markdown;
        try_files /index.md =404;
    }

    location = /llms.txt {
        default_type text/plain;
        try_files /llms.txt =404;
    }

    location = /.well-known/llms.txt {
        default_type text/plain;
        add_header Access-Control-Allow-Origin "*" always;
        try_files /.well-known/llms.txt =404;
    }

    location = /.well-known/api-catalog {
        default_type application/linkset+json;
        add_header Access-Control-Allow-Origin "*" always;
        try_files /.well-known/api-catalog =404;
    }

    location ^~ /.well-known/agent-skills/ {
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
